name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libasound2-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            pkg-config
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun test scripts
      - run: bun run build
      - run: bun run check:locales
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Verify Windows test manifests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-tests.ps1
      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Windows loader diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP 'openglaido-loader'
          New-Item -ItemType Directory -Force $diagnostics | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | Select-Object -First 1
          if (!$dumpbin) { throw 'MSVC dumpbin was not found' }
          Get-ChildItem src-tauri/target/debug/deps/openglaido*.exe | ForEach-Object {
            & $dumpbin /imports $_.FullName > (Join-Path $diagnostics ($_.Name + '.imports.txt'))
          }
          Get-ChildItem "$env:SystemRoot/System32/vcruntime*.dll", "$env:SystemRoot/System32/comctl32.dll" |
            ForEach-Object { $_.VersionInfo | Format-List FileName, FileVersion, ProductVersion } |
            Out-File (Join-Path $diagnostics 'runtime-versions.txt')
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/openglaido-loader
            ${{ runner.temp }}/openglaido-*.log
