[package]
name = "openglaido"
version = "0.1.0"
description = "Open source voice layer for every app"
authors = ["legoless"]
edition = "2021"

[lib]
name = "openglaido_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
cpal = "0.15"
hound = "3.5"
base64 = "0.22"
arboard = "3.4"
enigo = { version = "0.2" }
rusqlite = { version = "0.31", features = ["bundled"] }
rodio = "0.19"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
nnnoiseless = { version = "0.5.2", default-features = false }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
futures-util = "0.3.34"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
evalexpr = "13.1.0"
chrono-tz = "0.10.4"
sha2 = "0.10"
hex = "0.4"

# Noise reduction is too slow unoptimized (~0.6x real time); optimize it even in dev builds.
[profile.dev.package.nnnoiseless]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
block2 = "0.6"
# Local models (macOS only). whisper.cpp links its ggml statically; llama.cpp must be dynamic (two static ggml
# copies crash), and build.rs stages its dylibs for bundle.macOS.frameworks.
whisper-rs = { version = "0.16", features = ["metal"] }
llama-cpp-2 = { version = "0.1.157", default-features = false, features = ["metal", "dynamic-link"] }
# Not used in code. As a direct dependency, Cargo runs llama.cpp's build script before build.rs and passes DEP_LLAMA_GGML_CMAKE_DIR.
llama-cpp-sys-2 = "=0.1.157"
encoding_rs = "0.8"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
